name: Android APK CI and Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/splitflow-upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/splitflow-upload.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            CI_KEYSTORE="$RUNNER_TEMP/splitflow-upload.jks"
            CI_PASSWORD="splitflow-ci-release"
            keytool -genkeypair -v \
              -keystore "$CI_KEYSTORE" \
              -storepass "$CI_PASSWORD" \
              -keypass "$CI_PASSWORD" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SplitFlow,OU=CI,O=SplitFlow,L=Unknown,ST=Unknown,C=US" >/dev/null 2>&1
            echo "KEYSTORE_PATH=$CI_KEYSTORE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CI_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Decode Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon clean :app:assembleRelease

      - name: Name APK and generate checksum
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAG="build-${GITHUB_SHA::7}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="build-${GITHUB_SHA::7}"
          fi
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name 'app-release*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Release APK was not produced" >&2
            exit 1
          fi
          cp "$APK" "SplitFlow-${TAG}-release.apk"
          sha256sum "SplitFlow-${TAG}-release.apk" > "SplitFlow-${TAG}-release.apk.sha256"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitFlow-release
          path: |
            SplitFlow-*.apk
            SplitFlow-*.sha256
          if-no-files-found: error

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SplitFlow ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            SplitFlow-*.apk
            SplitFlow-*.sha256
