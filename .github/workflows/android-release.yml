name: Android APK CI and Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, v1.2.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KEYSTORE_DEST="$RUNNER_TEMP/splitflow-upload.jks"
          RESOLVED_ALIAS="${KEY_ALIAS:-upload}"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            CLEAN_B64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
            if ! printf '%s' "$CLEAN_B64" | base64 --decode > "$KEYSTORE_DEST"; then
              echo "::error::KEYSTORE_BASE64 is not valid base64 (it may be truncated or contain non-base64 text). Re-generate with: base64 -w 0 ~/splitflow-release.jks | xclip -sel clip (or save to a .txt file and copy all contents)."
              exit 1
            fi
            if ! keytool -list -keystore "$KEYSTORE_DEST" -storepass "$STORE_PASSWORD" -alias "$RESOLVED_ALIAS" >/dev/null 2>&1; then
              echo "::error::Decoded KEYSTORE_BASE64 could not be opened with STORE_PASSWORD and alias '$RESOLVED_ALIAS'. Double-check KEYSTORE_BASE64, STORE_PASSWORD, and that the keystore alias is 'upload'."
              exit 1
            fi
            echo "KEYSTORE_PATH=$KEYSTORE_DEST" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$RESOLVED_ALIAS" >> "$GITHUB_ENV"
            echo "Loaded and verified permanent release keystore from GitHub Secrets (alias: $RESOLVED_ALIAS)."
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "::error::Release tags require KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets so Google Sign-In SHA-1/SHA-256 fingerprints stay consistent."
            exit 1
          else
            echo "::warning::KEYSTORE_BASE64 secret not configured — generating an ephemeral CI keystore. Google Sign-In will NOT work on this APK until permanent keystore secrets are set and its SHA-1/SHA-256 is added to Firebase Console."
            CI_PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_DEST" \
              -storepass "$CI_PASSWORD" \
              -keypass "$CI_PASSWORD" \
              -alias "$RESOLVED_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SplitFlow,OU=CI,O=SplitFlow,L=Unknown,ST=Unknown,C=US" >/dev/null 2>&1
            echo "KEYSTORE_PATH=$KEYSTORE_DEST" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CI_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$RESOLVED_ALIAS" >> "$GITHUB_ENV"
          fi

      - name: Decode Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED_GS="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//')"
            if [[ "$TRIMMED_GS" == \{* ]]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Loaded raw JSON app/google-services.json from GitHub Secret GOOGLE_SERVICES_JSON."
            else
              CLEAN_GS_B64="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')"
              if ! printf '%s' "$CLEAN_GS_B64" | base64 --decode > app/google-services.json; then
                echo "::error::GOOGLE_SERVICES_JSON secret is neither valid JSON nor valid base64."
                exit 1
              fi
              echo "Decoded base64 app/google-services.json from GitHub Secret GOOGLE_SERVICES_JSON."
            fi
            python3 -m json.tool app/google-services.json >/dev/null
          elif [ -f app/google-services.json ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret not set; using committed app/google-services.json. Ensure it matches your Firebase project and includes your release keystore SHA-1/SHA-256."
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "::error::Release tags require the GOOGLE_SERVICES_JSON secret (raw JSON or base64-encoded google-services.json downloaded from Firebase Console)."
            exit 1
          fi

      - name: Run unit tests
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean :app:assembleRelease

      - name: Name APK, print signing SHA fingerprints, and generate checksum
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAG="build-${GITHUB_SHA::7}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="build-${GITHUB_SHA::7}"
          fi
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name 'app-release*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Release APK was not produced" >&2
            exit 1
          fi
          cp "$APK" "SplitFlow-${TAG}-release.apk"
          sha256sum "SplitFlow-${TAG}-release.apk" > "SplitFlow-${TAG}-release.apk.sha256"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

          echo "=== Release APK Signing Certificate Fingerprints ==="
          echo "Add BOTH SHA-1 and SHA-256 below to Firebase Console -> Project Settings -> Android App (com.aistudio.splitflow.kvnxqr) for Google Sign-In:"
          keytool -printcert -jarfile "SplitFlow-${TAG}-release.apk" | grep -E "SHA1:|SHA256:" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitFlow-release
          path: |
            SplitFlow-*.apk
            SplitFlow-*.sha256
          if-no-files-found: error

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SplitFlow ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            SplitFlow-*.apk
            SplitFlow-*.sha256
